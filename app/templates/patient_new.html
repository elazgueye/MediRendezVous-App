{% extends "base.html" %}

{% block content %}
<section class="mx-auto max-w-4xl px-4 py-16 sm:px-6 lg:px-8">
  <div class="rounded-[2rem] border border-slate-200 bg-white p-8 shadow-soft sm:p-12">
    <div class="mb-8">
      <p class="text-sm font-semibold uppercase tracking-[0.3em] text-violet-600">Espace patient</p>
      <h1 class="mt-3 text-3xl font-bold text-slate-900 sm:text-4xl">Créez votre profil santé</h1>
      <p class="mt-4 text-slate-600">Renseignez vos préférences et votre historique pour un service de rendez-vous plus personnalisé.</p>
    </div>
    <form method="POST" class="space-y-6">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="grid gap-6 sm:grid-cols-2">
        <div>
          <label class="mb-2 block text-sm font-semibold text-slate-700">Nom complet</label>
          <input type="text" name="nom" required class="w-full rounded-[1.5rem] border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 outline-none focus:border-violet-500 focus:ring-2 focus:ring-violet-100">
        </div>
        <div>
          <label class="mb-2 block text-sm font-semibold text-slate-700">Email</label>
          <input type="email" name="email" required class="w-full rounded-[1.5rem] border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 outline-none focus:border-violet-500 focus:ring-2 focus:ring-violet-100">
        </div>
      </div>
      <div class="grid gap-6 sm:grid-cols-2">
        <div>
          <label class="mb-2 block text-sm font-semibold text-slate-700">Téléphone</label>
          <input type="text" name="telephone" class="w-full rounded-[1.5rem] border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 outline-none focus:border-violet-500 focus:ring-2 focus:ring-violet-100">
        </div>
        <div>
          <label class="mb-2 block text-sm font-semibold text-slate-700">Mot de passe</label>
          <input type="password" name="password" required class="w-full rounded-[1.5rem] border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 outline-none focus:border-violet-500 focus:ring-2 focus:ring-violet-100">
        </div>
      </div>
      <div class="grid gap-6 sm:grid-cols-2">
        <div>
          <label class="mb-2 block text-sm font-semibold text-slate-700">Confirmez le mot de passe</label>
          <input type="password" name="confirm_password" required class="w-full rounded-[1.5rem] border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 outline-none focus:border-violet-500 focus:ring-2 focus:ring-violet-100">
        </div>
        <div>
          <label class="mb-2 block text-sm font-semibold text-slate-700">Préférence de spécialité</label>
          <select name="preference_specialite" class="w-full rounded-[1.5rem] border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 outline-none focus:border-violet-500 focus:ring-2 focus:ring-violet-100">
            <option value="">Choisir une spécialité</option>
            {% for specialite in specialites %}
            <option value="{{ specialite.nom }}">{{ specialite.nom }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="grid gap-6 sm:grid-cols-2">
        <div>
          <label class="mb-2 block text-sm font-semibold text-slate-700">Préférence de médecin</label>
          <input type="text" name="preference_medecin" placeholder="Ex: Dr. Dupont" class="w-full rounded-[1.5rem] border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 outline-none focus:border-violet-500 focus:ring-2 focus:ring-violet-100">
        </div>
        <div>
          <label class="mb-2 block text-sm font-semibold text-slate-700">Horaires préférés</label>
          <input type="text" name="horaires_preferes" placeholder="Matin / Après-midi" class="w-full rounded-[1.5rem] border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 outline-none focus:border-violet-500 focus:ring-2 focus:ring-violet-100">
        </div>
      </div>
      <div>
        <label class="mb-2 block text-sm font-semibold text-slate-700">Historique médical</label>
        <textarea name="historique_medical" rows="5" placeholder="Allergies, antécédents, traitements..." class="w-full rounded-[1.5rem] border border-slate-200 bg-slate-50 px-4 py-4 text-sm text-slate-900 outline-none focus:border-violet-500 focus:ring-2 focus:ring-violet-100"></textarea>
      </div>
      <button type="submit" class="inline-flex w-full items-center justify-center rounded-full bg-violet-600 px-6 py-3 text-sm font-semibold text-white shadow-lg transition hover:bg-violet-700">Créer mon profil</button>
    </form>
  </div>
</section>
{% endblock %}
