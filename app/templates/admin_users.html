{% extends "base.html" %}

{% block content %}
<section class="mx-auto max-w-6xl px-4 py-16 sm:px-6 lg:px-8">
  <div class="mb-10">
    <p class="text-sm font-semibold uppercase tracking-[0.3em] text-violet-600">Administration</p>
    <h1 class="mt-3 text-3xl font-bold text-slate-900">Utilisateurs</h1>
    <p class="mt-4 text-slate-600">Bloquez ou réactivez un compte en cas de comportement abusif.</p>
  </div>
  <div class="overflow-hidden rounded-[2rem] border border-slate-200 bg-white shadow-soft">
    <table class="min-w-full divide-y divide-slate-200">
      <thead class="bg-slate-50">
        <tr>
          <th class="px-6 py-4 text-left text-xs font-semibold uppercase tracking-[0.2em] text-slate-500">Email</th>
          <th class="px-6 py-4 text-left text-xs font-semibold uppercase tracking-[0.2em] text-slate-500">Rôle</th>
          <th class="px-6 py-4 text-left text-xs font-semibold uppercase tracking-[0.2em] text-slate-500">Statut</th>
          <th class="px-6 py-4 text-left text-xs font-semibold uppercase tracking-[0.2em] text-slate-500">Actions</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-200 bg-white">
        {% for user in users %}
        <tr class="hover:bg-slate-50">
          <td class="px-6 py-4 text-sm text-slate-700">{{ user.email }}</td>
          <td class="px-6 py-4 text-sm text-slate-700">{{ user.role }}</td>
          <td class="px-6 py-4 text-sm text-slate-700">{{ 'Bloqué' if not user.actif else 'Actif' }}</td>
          <td class="px-6 py-4 text-sm">
            <form method="POST" action="{{ url_for('admin_toggle_user', user_id=user.id) }}">
              <button type="submit" class="rounded-full bg-slate-100 px-4 py-2 text-xs font-semibold text-slate-700 transition hover:bg-slate-200">{{ 'Réactiver' if not user.actif else 'Bloquer' }}</button>
            </form>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</section>
{% endblock %}
